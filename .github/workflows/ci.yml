# CI del frontend: corre en cada PR (y en cada push a main). Si algo falla, el PR queda en rojo.
#   - tests:    npm ci, tests, build y npm audit (sólo dependencias de producción)
#   - secretos: gitleaks sobre TODO el historial (claves o tokens que se hayan subido por error)
# Las acciones van fijadas por commit (más seguro que por etiqueta); Dependabot las actualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Si algún día aparece una vulnerabilidad que no se puede arreglar, se ignora SÓLO esa (con comentario y
      # fecha), nunca se apaga el escaneo entero. Hoy (2026-10-14): 0 vulnerabilidades, nada ignorado.
      - run: npm audit --audit-level=high --omit=dev

  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # todo el historial, no sólo el último commit
      - name: Instalar gitleaks (versión fija, con checksum verificado)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # --redact: si encuentra algo, el log muestra dónde pero no el secreto
      - run: ./gitleaks git --redact --verbose --log-opts="--all" .
